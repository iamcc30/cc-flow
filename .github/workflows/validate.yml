name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CC Flow
        run: |
          chmod +x scripts/*.sh assets/repository-template/.ai/scripts/*.sh
          ./scripts/verify.sh
